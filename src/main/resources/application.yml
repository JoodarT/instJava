spring:
  application:
    name: instaJava

  # --- Datasource (H2, file-based) ---
  datasource:
    url: jdbc:h2:file:./data/instajava;AUTO_SERVER=TRUE;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # --- JPA / Hibernate ---

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- Liquibase ---
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # --- FreeMarker ---
  freemarker:
    suffix: .ftlh
    cache: false
    expose-request-attributes: true

  # --- File uploads ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: uploads

# --- OpenAPI / Swagger ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# --- Logging ---
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com.example.instajava: DEBUG
