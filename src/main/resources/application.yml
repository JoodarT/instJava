spring:
  application:
    name: instaJava

  # --- Datasource (H2, file-based) ---
  datasource:
    url: jdbc:h2:file:./data/instajava;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # --- JPA / Hibernate ---
  # Schema is owned by Liquibase migrations, Hibernate only validates it matches the entities.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # --- Liquibase ---
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # --- FreeMarker ---
  freemarker:
    suffix: .ftl
    cache: false

  # --- File uploads ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: uploads

# --- Logging ---
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com.example.instajava: DEBUG
