databaseChangeLog:
  - changeSet:
      id: 006-seed-initial-data
      author: instajava
      changes:
        # ==========================================
        # 1. ПОЛЬЗОВАТЕЛИ (USERS)
        # Пароль для всех: qwerty
        # ==========================================
        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: username, value: "john_doe" }
              - column: { name: email, value: "john@example.com" }
              - column: { name: password_hash, value: "$2a$12$lyp.Y1zym2Wj7/MzptfiCev5RWJVR9hPRI4yGwXZn2hjsk5VekUhW" }
              - column: { name: full_name, value: "John Doe" }
              - column: { name: bio, value: "Photographer & Traveler 🌍📷" }
              - column: { name: avatar_path, value: "/images/default-avatar.png" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: username, value: "jane_smith" }
              - column: { name: email, value: "jane@example.com" }
              - column: { name: password_hash, value: "$2a$12$lyp.Y1zym2Wj7/MzptfiCev5RWJVR9hPRI4yGwXZn2hjsk5VekUhW" }
              - column: { name: full_name, value: "Jane Smith" }
              - column: { name: bio, value: "Coffee lover ☕ | UI/UX Designer 🎨" }
              - column: { name: avatar_path, value: "/images/default-avatar.png" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: username, value: "alex_dev" }
              - column: { name: email, value: "alex@example.com" }
              - column: { name: password_hash, value: "$2a$12$lyp.Y1zym2Wj7/MzptfiCev5RWJVR9hPRI4yGwXZn2hjsk5VekUhW" }
              - column: { name: full_name, value: "Alex Developer" }
              - column: { name: bio, value: "Java & Spring Boot enthusiast 💻⚡" }
              - column: { name: avatar_path, value: "/images/default-avatar.png" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 4 }
              - column: { name: username, value: "kate_art" }
              - column: { name: email, value: "kate@example.com" }
              - column: { name: password_hash, value: "$2a$12$lyp.Y1zym2Wj7/MzptfiCev5RWJVR9hPRI4yGwXZn2hjsk5VekUhW" }
              - column: { name: full_name, value: "Kate Artist" }
              - column: { name: bio, value: "Digital art & Illustrations ✨" }
              - column: { name: avatar_path, value: "/images/default-avatar.png" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # ==========================================
        # 2. ПОДПИСКИ (FOLLOWS)
        # ==========================================
        # John подписан на Jane и Alex
        - insert:
            tableName: follows
            columns:
              - column: { name: follower_id, valueNumeric: 1 }
              - column: { name: followee_id, valueNumeric: 2 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
        - insert:
            tableName: follows
            columns:
              - column: { name: follower_id, valueNumeric: 1 }
              - column: { name: followee_id, valueNumeric: 3 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # Jane подписана на John и Kate
        - insert:
            tableName: follows
            columns:
              - column: { name: follower_id, valueNumeric: 2 }
              - column: { name: followee_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
        - insert:
            tableName: follows
            columns:
              - column: { name: follower_id, valueNumeric: 2 }
              - column: { name: followee_id, valueNumeric: 4 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # Alex и Kate подписаны на John
        - insert:
            tableName: follows
            columns:
              - column: { name: follower_id, valueNumeric: 3 }
              - column: { name: followee_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
        - insert:
            tableName: follows
            columns:
              - column: { name: follower_id, valueNumeric: 4 }
              - column: { name: followee_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # ==========================================
        # 3. ПУБЛИКАЦИИ (POSTS)
        # ==========================================
        - insert:
            tableName: posts
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: author_id, valueNumeric: 1 }
              - column: { name: image_path, value: "/uploads/sample-travel.jpg" }
              - column: { name: caption, value: "Sunset in the mountains! 🌄" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: posts
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: author_id, valueNumeric: 1 }
              - column: { name: image_path, value: "/uploads/sample-city.jpg" }
              - column: { name: caption, value: "Morning walk around the old city streets 🏙️" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: posts
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: author_id, valueNumeric: 2 }
              - column: { name: image_path, value: "/uploads/sample-coffee.jpg" }
              - column: { name: caption, value: "Found the coziest coffee shop today ☕❤️" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: posts
            columns:
              - column: { name: id, valueNumeric: 4 }
              - column: { name: author_id, valueNumeric: 3 }
              - column: { name: image_path, value: "/uploads/sample-code.jpg" }
              - column: { name: caption, value: "Refactoring Spring Security & Liquibase migrations 🚀" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # ==========================================
        # 4. ЛАЙКИ (LIKES)
        # ==========================================
        # Пост 1 (John) лайкнули Jane, Alex, Kate
        - insert:
            tableName: likes
            columns:
              - column: { name: user_id, valueNumeric: 2 }
              - column: { name: post_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
        - insert:
            tableName: likes
            columns:
              - column: { name: user_id, valueNumeric: 3 }
              - column: { name: post_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
        - insert:
            tableName: likes
            columns:
              - column: { name: user_id, valueNumeric: 4 }
              - column: { name: post_id, valueNumeric: 1 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # Пост 3 (Jane) лайкнули John и Alex
        - insert:
            tableName: likes
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: post_id, valueNumeric: 3 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
        - insert:
            tableName: likes
            columns:
              - column: { name: user_id, valueNumeric: 3 }
              - column: { name: post_id, valueNumeric: 3 }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        # ==========================================
        # 5. КОММЕНТАРИИ (COMMENTS)
        # ==========================================
        - insert:
            tableName: comments
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: post_id, valueNumeric: 1 }
              - column: { name: author_id, valueNumeric: 2 }
              - column: { name: text, value: "Amazing shot, John! 🔥" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: comments
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: post_id, valueNumeric: 1 }
              - column: { name: author_id, valueNumeric: 3 }
              - column: { name: text, value: "Where was this photo taken?" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }

        - insert:
            tableName: comments
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: post_id, valueNumeric: 3 }
              - column: { name: author_id, valueNumeric: 1 }
              - column: { name: text, value: "Looks awesome, need to visit it too!" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }