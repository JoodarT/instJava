databaseChangeLog:
  - changeSet:
      id: 002-create-posts-table
      author: instajava
      changes:
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: image_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: caption
                  type: VARCHAR(2000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: author_id
            constraintName: fk_posts_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: posts
            indexName: idx_posts_author_id
            columns:
              - column:
                  name: author_id
        - createIndex:
            tableName: posts
            indexName: idx_posts_created_at
            columns:
              - column:
                  name: created_at
