databaseChangeLog:
  - changeSet:
      id: 003-create-likes-table
      author: instajava
      changes:
        - createTable:
            tableName: likes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: post_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: likes
            baseColumnNames: user_id
            constraintName: fk_likes_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: likes
            baseColumnNames: post_id
            constraintName: fk_likes_post
            referencedTableName: posts
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: likes
            columnNames: user_id, post_id
            constraintName: uk_likes_user_post
        - createIndex:
            tableName: likes
            indexName: idx_likes_post_id
            columns:
              - column:
                  name: post_id
